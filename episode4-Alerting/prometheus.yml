global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]

rule_files:
  - alert_rules.yml

# Dispatch connection = prometheus does not send alerts it send alert to altermanager and then alertmanagegr send it to notification channels.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

